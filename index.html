<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Event Pass Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f4f4f4;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

.wrapper {
  max-width: 480px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

h1 {
  font-size: 25px;
  margin: 5px 0 20px;
}

#reader {
  width: 100%;
  margin-top: 15px;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 22px;
  text-align: center;
  border: 1px solid #aaa;
  border-radius: 9px;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 17px;
  font-size: 20px;
  font-weight: bold;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}

.start,
.next {
  background: #222;
  color: white;
}

.status {
  font-size: 36px;
  font-weight: bold;
  margin-top: 15px;
}

.name {
  font-size: 28px;
  font-weight: bold;
  margin-top: 18px;
}

.pass {
  font-size: 20px;
  margin-top: 8px;
}

.time {
  font-size: 16px;
  margin-top: 12px;
}

.green {
  color: #147533;
}

.red {
  color: #b00020;
}

.orange {
  color: #a25b00;
}

#result {
  display: none;
}

#working {
  display: none;
  font-size: 20px;
  padding: 30px 0;
}

</style>
</head>


<body>

<div class="wrapper">

<div class="card">

<h1>Event Pass Scanner</h1>


<div id="login">

  <p>Enter Staff PIN</p>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    placeholder="Staff PIN">

  <button
    class="start"
    onclick="beginScanning()">
    START SCANNER
  </button>

</div>


<div id="scannerArea"
     style="display:none;">

  <div id="reader"></div>

</div>


<div id="working">
  Validating pass...
</div>


<div id="result"></div>

</div>
</div>


<script>

/**********************************************
 PUT YOUR CURRENT APPS SCRIPT /exec URL HERE
**********************************************/

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbyFkG5cqss6bhCd8GLr_VUgPtYY3j4h3scy67NYHTP7FmRGUAv_59JFRbPKMEamAclM/exec";


let staffPin = "";
let scanner = null;
let processing = false;
let requestScript = null;


/**********************************************
 START
**********************************************/

window.addEventListener("load", function() {

  const savedPin =
    localStorage.getItem("eventStaffPin");

  if (savedPin) {
    document.getElementById("pin").value =
      savedPin;
  }

});


function beginScanning() {

  staffPin =
    document.getElementById("pin")
      .value
      .trim();

  if (!staffPin) {
    alert("Please enter the staff PIN.");
    return;
  }

  localStorage.setItem(
    "eventStaffPin",
    staffPin
  );

  document.getElementById("login")
    .style.display = "none";

  startCamera();
}


/**********************************************
 CAMERA
**********************************************/

function startCamera() {

  processing = false;

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("working")
    .style.display = "none";

  document.getElementById("scannerArea")
    .style.display = "block";

  document.getElementById("reader")
    .innerHTML = "";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


    function(decodedText) {

      if (processing) {
        return;
      }

      processing = true;

      scanner.stop()

        .then(function() {
          validateQR(decodedText);
        })

        .catch(function() {
          validateQR(decodedText);
        });

    },


    function() {
      // Ignore normal scan misses
    }

  )

  .catch(function(err) {

    showError(
      "Camera could not start. " +
      "Please allow camera access."
    );

  });
}


/**********************************************
 SEND QR TO GOOGLE
**********************************************/

function validateQR(code) {

  document.getElementById("scannerArea")
    .style.display = "none";

  document.getElementById("working")
    .style.display = "block";

  document.getElementById("result")
    .style.display = "none";


  // Remove previous request
  if (requestScript) {

    try {
      requestScript.remove();
    } catch(e) {}

  }


  requestScript =
    document.createElement("script");


  requestScript.src =
    WEB_APP_URL +

    "?code=" +
    encodeURIComponent(code) +

    "&pin=" +
    encodeURIComponent(staffPin) +

    "&callback=handleValidationResponse" +

    "&nocache=" +
    Date.now();


  requestScript.onerror =
    function() {

      document.getElementById("working")
        .style.display = "none";

      showError(
        "Validator could not be contacted."
      );

    };


  document.body.appendChild(
    requestScript
  );
}


/**********************************************
 GOOGLE RESPONSE ARRIVES HERE
**********************************************/

function handleValidationResponse(data) {

  document.getElementById("working")
    .style.display = "none";

  showResult(data);
}


/**********************************************
 DISPLAY RESULT
**********************************************/

function showResult(data) {

  const box =
    document.getElementById("result");

  box.style.display = "block";


  if (data.status === "VALID") {

    box.innerHTML = `

      <div class="status green">
        ✓ VALID
      </div>

      <div class="name">
        ${escapeHtml(data.guestName)}
      </div>

      <div class="pass">
        Pass ${escapeHtml(data.passNo)}
      </div>

      <div class="time">
        Checked in:
        ${escapeHtml(data.checkedAt)}
      </div>

      <button
        class="next"
        onclick="scanNext()">
        SCAN NEXT
      </button>
    `;

    return;
  }


  if (data.status === "USED") {

    box.innerHTML = `

      <div class="status red">
        ⛔ ALREADY USED
      </div>

      <div class="name">
        ${escapeHtml(data.guestName)}
      </div>

      <div class="pass">
        Pass ${escapeHtml(data.passNo)}
      </div>

      <div class="time">
        First check-in:
        ${escapeHtml(data.checkedAt)}
      </div>

      <button
        class="next"
        onclick="scanNext()">
        SCAN NEXT
      </button>
    `;

    return;
  }


  if (data.status === "BAD_PIN") {

    localStorage.removeItem(
      "eventStaffPin"
    );

    box.innerHTML = `

      <div class="status red">
        WRONG STAFF PIN
      </div>

      <button
        class="next"
        onclick="restartLogin()">
        ENTER PIN AGAIN
      </button>
    `;

    return;
  }


  if (data.status === "INVALID") {

    box.innerHTML = `

      <div class="status orange">
        ✕ INVALID PASS
      </div>

      <p>
        QR code is not on the guest list.
      </p>

      <button
        class="next"
        onclick="scanNext()">
        SCAN NEXT
      </button>
    `;

    return;
  }


  showError(
    data.message ||
    "Unknown validator response."
  );
}


/**********************************************
 NEXT QR
**********************************************/

function scanNext() {

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("working")
    .style.display = "none";

  startCamera();
}


/**********************************************
 WRONG PIN
**********************************************/

function restartLogin() {

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("scannerArea")
    .style.display = "none";

  document.getElementById("login")
    .style.display = "block";
}


/**********************************************
 ERROR
**********************************************/

function showError(message) {

  const box =
    document.getElementById("result");

  box.style.display = "block";

  box.innerHTML = `

    <div class="status red">
      ERROR
    </div>

    <p>
      ${escapeHtml(message)}
    </p>

    <button
      class="next"
      onclick="scanNext()">
      TRY AGAIN
    </button>
  `;
}


/**********************************************
 SECURITY
**********************************************/

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
